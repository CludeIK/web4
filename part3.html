<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 3 - Advanced Form Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Assign 4</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="part1.html">Part 1</a></li>
                <li class="nav-item"><a class="nav-link" href="part2.html">Part 2</a></li>
                <li class="nav-item"><a class="nav-link active" href="part3.html">Part 3</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5" style="max-width: 800px;">
    <h2>Part 3. Advanced Form Project</h2>
    <hr>
    <h4>Task 4: Registration Form</h4>

    <form class="needs-validation mt-4 p-4 border rounded shadow-sm" novalidate>
        <!-- First Name & Last Name (Grid) -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required>
                <div class="invalid-feedback">Please enter your first name.</div>
            </div>
            <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
                <div class="invalid-feedback">Please enter your last name.</div>
            </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="regEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="regEmail" required>
            <div class="invalid-feedback">A valid email is required.</div>
        </div>

        <!-- Passwords (Grid) -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" minlength="8" required>
                <div class="invalid-feedback">Password must be at least 8 characters.</div>
            </div>
            <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
                <div class="invalid-feedback">Please confirm your password.</div>
            </div>
        </div>

        <!-- Gender (Radio) -->
        <div class="mb-3">
            <label class="form-label d-block">Gender</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" required>
                <label class="form-check-label" for="genderMale">Male</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female" required>
                <label class="form-check-label" for="genderFemale">Female</label>
            </div>
        </div>

        <!-- Hobbies (Checkboxes) -->
        <div class="mb-3">
            <label class="form-label d-block">Hobbies</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                <label class="form-check-label" for="hobbyReading">Reading</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
                <label class="form-check-label" for="hobbyCoding">Coding</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                <label class="form-check-label" for="hobbySports">Sports</label>
            </div>
        </div>

        <!-- Country (Select) -->
        <div class="mb-4">
            <label for="country" class="form-label">Country</label>
            <select class="form-select" id="country" required>
                <option value="" selected disabled>Choose your country...</option>
                <option value="kz">Kazakhstan</option>
                <option value="us">United States</option>
                <option value="uk">United Kingdom</option>
                <option value="other">Other</option>
            </select>
            <div class="invalid-feedback">Please select a valid country.</div>
        </div>

        <button type="submit" class="btn btn-success me-2">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
    </form>
</div>

<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
</body>
</html>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Assignment 4</a>
        <div class="collapse navbar-collapse">

                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

                <li class="nav-item"><a class="nav-link" href="part3.html">Part 3</a></li>

        </div>

</nav>

<div class="container mt-5" style="max-width: 600px;">
    <h2>Part 2. Bootstrap Forms</h2>
    <hr>
    <h4>Task 2 & 3: Bootstrap Form Styling & Validation</h4>

    <form class="needs-validation mt-4" novalidate>
        <div class="mb-3">
            <label for="bsName" class="form-label">Name</label>
            <input type="text" class="form-control" id="bsName" placeholder="Enter your full name" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please enter your name.</div>
        </div>

        <div class="mb-3">
            <label for="bsEmail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="bsEmail" placeholder="name@example.com" required>
            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please provide a valid email.</div>
        </div>

        <div class="mb-3">
            <label for="bsMessage" class="form-label">Message</label>
            <textarea class="form-control" id="bsMessage" rows="4" placeholder="Write your message here..." style="resize: none;" required></textarea>
            <div class="invalid-feedback">Message cannot be empty.</div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
</body>
</html>
